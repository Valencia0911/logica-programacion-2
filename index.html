<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <section class="container py-5">
        <div class="row g-4 justify-content-center">
            <div class="col-12 col-md-8">
                <h1 class="text-center">Convertir temperatura</h1>
                <form id="formularioTemperatura">
                    <div class="row g-4">
                        <p>Ingrese la temperatura en celsius</p>
                        <label for="celsius" class="form-label">Celsius</label>
                        <input type="number" class="form-control" id="celsius">
                    </div>
                    <div class="d-flex justify-content-center">
                        <button type="submit" class="btn btn-primary mt-3">Convertir</button>
                    </div>
                </form>
                <div class="row g-3 justify-content-center mt-4">
                    <div class="col-12 col-sm-6">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title">Kelvin</h5>
                                <p id="resultadoKelvin"></p>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title">Fahrenheit</h5>
                                <p id="resultadoFahrenheit"></p>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </section>

    <script src="logica.js" defer></script>
</body>

</html>
